name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Tests and debug APK
        run: ./gradlew test assembleDebug --max-workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: fight-forge-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Restore persistent release identity
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.FIGHTFORGE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FIGHTFORGE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets unavailable; use the persistent cloud key for signed releases.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing/release.p12"
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/signing/store-password"
          chmod 600 "$RUNNER_TEMP/signing/"*
      - name: Signed release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        env:
          FIGHTFORGE_SIGNING_DIR: ${{ runner.temp }}/signing
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(git rev-list --count HEAD)"
          ./gradlew assembleRelease -PreleaseName="$VERSION" -PreleaseCode="$CODE" --max-workers=4
          cp app/build/outputs/apk/release/app-release.apk FightForge.apk
          sha256sum FightForge.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" FightForge.apk SHA256SUMS --title "Fight Forge $VERSION" --generate-notes --prerelease
      - name: Remove runner signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
