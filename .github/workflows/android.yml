name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Tests and debug APK
        run: ./gradlew test assembleDebug --max-workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: fight-forge-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Restore persistent release identity
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.FIGHTFORGE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FIGHTFORGE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets unavailable; use the persistent cloud key for signed releases.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing/release.p12"
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/signing/store-password"
          chmod 600 "$RUNNER_TEMP/signing/"*
      - name: Signed release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        env:
          FIGHTFORGE_SIGNING_DIR: ${{ runner.temp }}/signing
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(git rev-list --count HEAD)"
          ./gradlew assembleRelease -PreleaseName="$VERSION" -PreleaseCode="$CODE" --max-workers=4
          cp app/build/outputs/apk/release/app-release.apk FightForge.apk
          sha256sum FightForge.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" FightForge.apk SHA256SUMS --title "Fight Forge $VERSION" --generate-notes --prerelease
      - name: Remove runner signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
  publish-prepared:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release:v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Read requested release version
        id: version
        run: |
          TAG="$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH" | sed -nE 's/.*\[publish-release:(v[0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p')"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: release-artifacts/${{ steps.version.outputs.tag }}
          path: prepared
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify prepared signed APK
        run: |
          sdkmanager 'build-tools;34.0.0'
          cd prepared
          sha256sum --check SHA256SUMS
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs FightForge.apk | tee signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: a8c231eb36ba8c1682da32929d95e16180a4fa62482ef05ba8f4a4feac2073de' signature.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          SOURCE_COMMIT="$(cat prepared/SOURCE_COMMIT)"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" prepared/FightForge.apk prepared/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" prepared/FightForge.apk prepared/SHA256SUMS --verify-tag --target "$SOURCE_COMMIT" --title "Fight Forge $RELEASE_TAG" --prerelease --notes-file source/RELEASE_NOTES.md
          fi
