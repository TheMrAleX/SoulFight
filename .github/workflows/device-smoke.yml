name: Android device smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'scripts/device-smoke.py'
      - '.github/workflows/device-smoke.yml'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and prepare device
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'emulator' 'system-images;android-29;default;x86_64'
          ./gradlew assembleDebug --max-workers=2
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd -n smoke -k 'system-images;android-29;default;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "^1$"; do sleep 2; done'
          adb shell input keyevent 82
          adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Exercise actual gameplay navigation
        run: python3 scripts/device-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence
          path: |
            /tmp/fightforge-device-evidence/
            /tmp/emulator.log
