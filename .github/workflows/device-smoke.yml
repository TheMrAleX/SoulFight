name: Android device smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'scripts/device-smoke.py'
      - '.github/workflows/device-smoke.yml'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_AVD_HOME: /tmp/fightforge-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install official emulator and SDK
        timeout-minutes: 6
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'emulator' 'system-images;android-29;default;x86_64'
      - name: Build debug APK
        timeout-minutes: 6
        run: ./gradlew assembleDebug assembleDebugAndroidTest --max-workers=2
      - name: Start accelerated device
        timeout-minutes: 6
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n smoke -p "$ANDROID_AVD_HOME/smoke.avd" -k 'system-images;android-29;default;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan -accel on -cores 2 -memory 2048 > /tmp/emulator.log 2>&1 &
          if ! timeout 120 adb wait-for-device; then cat /tmp/emulator.log; exit 1; fi
          if ! timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "^1$"; do sleep 2; done'; then cat /tmp/emulator.log; exit 1; fi
          timeout 30 adb shell input keyevent 82
          timeout 60 adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Exercise actual gameplay navigation
        run: python3 scripts/device-smoke.py
      - name: Exercise TCP transport, assets, persistence and pixel editor
        if: always()
        timeout-minutes: 4
        run: |
          set -euo pipefail
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 180 adb shell am instrument -w com.fightforge.game.test/com.fightforge.game.ForgeInstrumentation | tee /tmp/fightforge-device-evidence/instrumentation.txt
          grep -q 'passed=true' /tmp/fightforge-device-evidence/instrumentation.txt
          grep -q 'INSTRUMENTATION_CODE: -1' /tmp/fightforge-device-evidence/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence
          path: |
            /tmp/fightforge-device-evidence/
            /tmp/emulator.log
